[build]
  command = "npm run build && cd portal/client && npm install && npm run build"
  publish = "dist"

# SPA redirect for portal React app
[[redirects]]
  from = "/portal"
  to = "/portal/index.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/portal/index.html"
  status = 200

# Ensure main site HTML pages don't get caught by portal redirect
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
